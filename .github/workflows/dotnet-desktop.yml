name: Build

on:
  push:
    branches: [main, feat-gh-actions, feat-gh-actions-arm]
  pull_request:
    branches: [main, feat-gh-actions, feat-gh-actions-arm]

jobs:
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc g++ curl git

      - name: Cache model
        uses: actions/cache@v5
        with:
          path: deej-ai.onnx
          key: deej-ai-model

      - name: Build
        run: dotnet build --configuration Release

      - name: Set executable bit
        run: chmod +x bin/Release/net9.0/Deej-AI/deej-ai.cpp/bin/deej-ai

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64
          path: bin/Release/net9.0/
